<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Biryani Walla Staff Schedule</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f2e9;--ink:#111;--mute:#8a8578;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Oswald',Impact,'Arial Narrow',sans-serif;letter-spacing:.02em}
.wrap{max-width:1180px;margin:0 auto;padding:16px 14px 40px}
.hero{background:#000;border:3px solid var(--ink);display:flex;justify-content:center;padding:10px}
.hero img{height:110px;max-width:100%;object-fit:contain}
.band{background:#000;color:var(--bg);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:8px 14px;text-transform:uppercase;font-size:14px;letter-spacing:.12em;border:3px solid var(--ink);border-top:0}
h1{font-weight:600;text-transform:uppercase;text-align:center;font-size:26px;margin:18px 0 12px;letter-spacing:.08em}
button,input{font:inherit;color:var(--ink)}
.btn{border:2px solid var(--ink);background:var(--bg);padding:6px 14px;cursor:pointer;text-transform:uppercase;letter-spacing:.08em;border-radius:0}
.btn:active,.btn.dark{background:var(--ink);color:var(--bg)}
.nav{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.nav .range{min-width:190px;text-align:center;font-size:18px;font-weight:500}
.nav .arrow{font-size:22px;line-height:1;padding:2px 14px}
.mbar{display:none;justify-content:center;gap:8px;flex-wrap:wrap;margin-bottom:14px;padding:10px;border:2px dashed var(--ink)}
.mbar.on{display:flex}
.scroll{overflow-x:auto;border:3px solid var(--ink)}
table{border-collapse:collapse;width:100%;min-width:900px}
th,td{border:2px solid var(--ink);text-align:center;padding:0}
th{padding:8px 4px;font-weight:500;text-transform:uppercase;font-size:14px}
th small{display:block;font-size:20px;font-weight:600;line-height:1.1}
th.today{background:var(--ink);color:var(--bg)}
td.team{font-weight:600;text-transform:uppercase;width:92px;background:#ece6d6}
td.name{text-align:left;padding:8px 10px;font-weight:600;text-transform:uppercase;width:110px}
td.cell{height:46px;font-size:13px;font-weight:500;padding:2px 4px}
td.hrs,td.tot{font-weight:600;font-size:17px;width:64px}
tr.total td{background:#ece6d6;font-weight:600;font-size:17px;text-align:center}
td.today{background:#ece6d6}
td.off{color:var(--mute);background:repeating-linear-gradient(45deg,transparent 0 6px,#e4ddcb 6px 8px)}
td.tba{background:#ddd5bf}
.m td.cell,.m td.name,.m td.note{cursor:pointer}
.m td.cell:hover{background:#e3dcc8}
.ln{display:block;font-size:11px;color:var(--mute);cursor:pointer;margin-top:3px}
.box{border:3px solid var(--ink);margin-top:22px}
.box h3{margin:0;background:#000;color:var(--bg);padding:8px 14px;text-transform:uppercase;letter-spacing:.12em;font-size:15px;font-weight:500}
.ops{padding:10px 14px;border-bottom:2px solid var(--ink);display:flex;gap:22px;flex-wrap:wrap;font-weight:500}
.notes{list-style:none;margin:0;padding:0;counter-reset:n}
.notes li{display:flex;gap:12px;padding:8px 14px;border-top:2px solid var(--ink);font-size:15px;letter-spacing:.01em}
.notes li:first-child{border-top:0}
.notes li:before{counter-increment:n;content:counter(n);font-weight:600;min-width:16px}
.empty{padding:30px;text-align:center;color:var(--mute);text-transform:uppercase;letter-spacing:.1em}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:9}
.ov.on{display:flex}
.modal{background:var(--bg);border:3px solid var(--ink);padding:18px;width:100%;max-width:360px}
.modal h2{margin:0 0 12px;font-size:18px;text-transform:uppercase;letter-spacing:.08em}
.modal input,.modal textarea{width:100%;border:2px solid var(--ink);background:#fff;padding:9px;margin-bottom:10px;border-radius:0;font:inherit}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chips .btn{padding:3px 10px;font-size:14px}.chips .btn.sel{background:var(--ink);color:var(--bg)}
.row{display:flex;gap:8px;justify-content:flex-end}
.modal label{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--mute);margin-bottom:3px}.modal select{width:100%;border:2px solid var(--ink);background:#fff;padding:9px;margin-bottom:10px;border-radius:0;font:inherit}.ops span[data-o]{border:2px solid var(--ink);padding:4px 10px}.m .ops span[data-o]{cursor:pointer}.hint{text-align:center;color:var(--mute);font-size:13px;margin-top:10px}
#cap{background:var(--bg);padding:2px}.sub{text-align:center;font-size:18px;font-weight:500;margin:-6px 0 14px;letter-spacing:.06em}.nav{}.sm{background:#f7e4a0}.sa{background:#cfe6c8}.se{background:#f6c9ad}.sn{background:#c9d0ec}.legend{display:flex;flex-wrap:wrap;gap:6px 16px;justify-content:center;margin:0 0 12px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;font-weight:500}.legend i{display:inline-block;width:16px;height:16px;border:2px solid #111;vertical-align:-3px;margin-right:5px}.legend i.off{background:repeating-linear-gradient(45deg,#f6f2e9 0 3px,#d9d2bf 3px 5px)}.m td.cell:hover{filter:brightness(.92)}.legend i.tba{background:#ddd5bf}#pay .pb{padding:12px 14px}#pay table{min-width:0;width:100%}#pay th,#pay td{padding:6px 8px;font-size:15px}#pay td.pn{text-align:left;font-weight:600;text-transform:uppercase}#pay input[type=number]{width:100%;max-width:110px;border:2px solid #111;background:#fff;padding:5px;font:inherit;border-radius:0}.pf{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:end;margin-bottom:12px}.pf label{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--mute);display:block;margin-bottom:3px}.big{border:3px solid #111;padding:10px 14px;margin-top:12px;display:flex;flex-wrap:wrap;gap:8px 28px;align-items:baseline}.big b{font-size:34px;font-weight:600}.pubbar{position:fixed;left:0;right:0;bottom:0;background:#000;color:#f6f2e9;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));display:none;justify-content:space-between;align-items:center;gap:12px;z-index:5;border-top:3px solid #f6f2e9}.pubbar.on{display:flex}.pubbar span{font-size:15px;letter-spacing:.04em}.pubbar button{background:#f6f2e9;color:#000;border:0;padding:12px 26px;font:inherit;font-size:18px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;cursor:pointer;border-radius:0}.pubbar button:active{opacity:.7}</style></head><body>

 "OFF", "OFF", "OFF", "OFF", "OFF", "OFF"]], "s10": [["8:00 PM - 2:00 AM", "OFF", "8:00 PM - 2:00 AM", "OFF", "8:00 PM - 3:00 AM", "OFF", "8:00 PM - 2:00 AM"]], "s11": [["OFF", "8:00 PM - 2:00 AM", "OFF", "OFF", "OFF", "11:00 PM - 7:00 AM", "11:00 PM - 7:00 AM"]]}}, "ops": [{"days": "Sunday – Thursday", "open": "9:00 AM", "close": "2:00 AM"}, {"days": "Friday & Saturday", "open": "9:00 AM", "close": "3:00 AM"}], "notes": ["Please be on the scheduled time. If any delay, please inform Chef Sandeep.", "If required to stay longer due to busy needs, it must be updated in the WhatsApp group with reasoning, otherwise pay will be given as per schedule only.", "One meal is allowed for less than 6 hours shift, two meals is allowed for 10 hours or longer shifts.", "15% discount will be provided for all employees in case they want to purchase any extra meals.", "Alcohol/Cannabis consumption in the premises is strictly prohibited, if found will be fired immediately.", "Any team member issues / team management needs to be informed to Sangeet Ahuja.", "Any issues related to operational/managerial issues need to be updated to Sangeet Ahuja.", "If any team member has major concerns which cannot be resolved by above personnel, please feel free to reach out to Manav Behl and Siddhant Chaudhary."]}</script>
<script>
var $=function(i){return document.getElementById(i)};
var D=JSON.parse($('data').textContent),A=null,mgr=false,dirty=false,DAYS=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML}
function iso(d){return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
function mon(d){d=new Date(d.getFullYear(),d.getMonth(),d.getDate());d.setDate(d.getDate()-(d.getDay()+6)%7);return d}
function pd(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2])}
var ws=mon(new Date());
D.ops=D.ops.map(function(o){return typeof o==='string'?{days:o,open:'9:00 AM',close:'2:00 AM'}:o});
function key(){return iso(ws)}
function hrs(s){var m=/^(\d+):(\d\d) (AM|PM) - (\d+):(\d\d) (AM|PM)$/.exec(s);if(!m)return 0;
 function t(h,mi,ap){h=+h%12+(ap==='PM'?12:0);return h+mi/60}
 var a=t(m[1],+m[2],m[3]),b=t(m[4],+m[5],m[6]);if(b<=a)b+=24;return b-a}
function norm(v){v=v.trim();if(!v||/^off$/i.test(v))return 'OFF';if(/^tba$/i.test(v))return 'TBA';
 var m=/^(\d{1,2})(?::(\d\d))?\s*(a|p)m?\s*-\s*(\d{1,2})(?::(\d\d))?\s*(a|p)m?$/i.exec(v);
 if(!m)return v.toUpperCase();function f(h,mi,ap){return h+':'+(mi||'00')+' '+ap.toUpperCase()+'M'}
 return f(m[1],m[2],m[3])+' - '+f(m[4],m[5],m[6])}
function r1(n){return Math.round(n*10)/10}
var TC=[['#f0c29a','#f8e3d1'],['#bcd9b6','#e1efdd'],['#bccbe8','#dfe7f4'],['#e6bcd4','#f3dfeb'],['#e3d98f','#f2edc9']];
function tc(t,k){return TC[Math.max(0,D.teams.indexOf(t))%TC.length][k]}
function sc(v){if(v==='OFF')return' off';if(v==='TBA')return' tba';return''}
function render(){
 $('loc').textContent=D.loc;
 var e=new Date(ws);e.setDate(e.getDate()+6),M=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
 $('sub').textContent=$('range').textContent=M[ws.getMonth()]+' '+ws.getDate()+' – '+(e.getMonth()!==ws.getMonth()?M[e.getMonth()]+' ':'')+e.getDate()+', '+e.getFullYear();
 $('mbar').className='mbar'+(mgr?' on':'');$('pubbar').className='pubbar'+(mgr?' on':'');document.body.style.paddingBottom=mgr?'90px':'';
 $('mgr').textContent=mgr?'Exit manager':'Manager';
 $('cWeek').style.display=$('bWeek').style.display=D.weeks[key()]?'none':'';
 $('hint').textContent=mgr?'Tap a cell to pick shift hours · tap a name to edit staff · tap hours or a note to edit · changes go live when you tap Publish schedule':'';
 var W=D.weeks[key()],h='';
 if(!W){h='<div class="scroll"><div class="empty">No schedule posted for this week yet</div></div>'}
 else{
  var td=iso(new Date()),days=[];for(var i=0;i<7;i++){var d=new Date(ws);d.setDate(d.getDate()+i);days.push(d)}
  h='<div class="scroll"><table class="'+(mgr?'m':'')+'"><tr><th>Team</th><th>Name</th>';
  days.forEach(function(d,i){h+='<th class="'+(iso(d)===td?'today':'')+'">'+DAYS[i]+'<small>'+d.getDate()+'</small></th>'});
  h+='<th>Hours</th></tr>';
  var dt=[0,0,0,0,0,0,0],all=0;
  D.teams.forEach(function(t){
   var ps=D.staff.filter(function(s){return s.team===t});if(!ps.length)return;
   var n=ps.reduce(function(a,s){return a+(W[s.id]||[0]).length},0),first=true;
   ps.forEach(function(s){
    var ls=W[s.id]||[['OFF','OFF','OFF','OFF','OFF','OFF','OFF']],tot=0;
    ls.forEach(function(l,li){
     h+='<tr>';
     if(first){h+='<td class="team" style="background:'+tc(t,0)+'" rowspan="'+n+'">'+esc(t)+'</td>';first=false}
     if(li===0)h+='<td class="name" style="background:'+tc(t,1)+'" rowspan="'+ls.length+'" data-s="'+s.id+'">'+esc(s.name)+(mgr?'<span class="ln" data-add="'+s.id+'">+ split shift</span>':'')+'</td>';
     l.forEach(function(v,di){var c=hrs(v);tot+=c;dt[di]+=c;
      h+='<td class="cell'+sc(v)+'" data-s="'+s.id+'" data-l="'+li+'" data-d="'+di+'">'+esc(v)+'</td>'});
     if(li===0)h+='<td class="hrs" rowspan="'+ls.length+'">@@'+s.id+'@@</td>';
     h+='</tr>'});
    all+=tot;h=h.replace('@@'+s.id+'@@',r1(tot))});
  });
  h+='<tr class="total"><td colspan="2">TOTAL</td>'+dt.map(function(v){return '<td>'+r1(v)+'</td>'}).join('')+'<td>'+r1(all)+'</td></tr></table></div>';
 }
 h+='<div class="box"><h3>Operational Hours</h3><div class="ops">'+D.ops.map(function(o,i){return '<span data-o="'+i+'">'+esc(o.days)+': '+o.open+' to '+o.close+'</span>'}).join('')+'</div><h3>Important Notes</h3><ul class="notes '+(mgr?'m':'')+'">'+D.notes.map(function(n,i){return '<li data-n="'+i+'"'+(mgr?' style="cursor:pointer"':'')+'>'+esc(n)+'</li>'}).join('')+'</ul>'+(mgr?'<div style="padding:10px;text-align:center;border-top:2px solid var(--ink)"><button class="btn" data-act="note">+ Add note</button> <button class="btn" data-act="ops">+ Add hours</button></div>':'')+'</div>';
 $('app').innerHTML=h;payRender();
}
var cb=null,cd=null,tmp=null;
function modal(title,val,chips,onSave,onDel,onChip,sel){
 $('mt').textContent=title;$('mi').value=val;$('mc').innerHTML='';
 (chips||[]).forEach(function(c){var b=document.createElement('button');b.className='btn'+(c===sel?' sel':'');b.textContent=c;b.onclick=function(){if(onChip){onChip(c);[].forEach.call($('mc').children,function(x){x.classList.remove('sel')});b.classList.add('sel')}else $('mi').value=c};$('mc').appendChild(b)});
 $('md').style.display=onDel?'':'none';cb=onSave;cd=onDel;$('ov').classList.add('on');$('mi').focus();
}
function close(){$('ov').classList.remove('on')}
function chg(){dirty=true;$('st').textContent='● Changes not published yet';render()}
$('ms').onclick=function(){var v=$('mi').value;close();cb&&cb(v)};
$('md').onclick=function(){close();cd&&cd()};$('mx').onclick=close;
$('mi').onkeydown=function(e){if(e.key==='Enter')$('ms').click()};
var TO=[];for(var i=0;i<96;i++){var hh=Math.floor(i/4),mm=i%4*15;TO.push((hh%12||12)+':'+('0'+mm).slice(-2)+' '+(hh<12?'AM':'PM'))}
['ts','te'].forEach(function(id){$(id).innerHTML=TO.map(function(x){return '<option>'+x+'</option>'}).join('')});
var tcb=null,tcd=null,tqc=null;
function timeModal(title,s,e,o){
 $('tt').textContent=title;$('ts').value=s;$('te').value=e;tcb=o.onSave;tcd=o.onDel||null;tqc=o.onQuick;
 $('td').style.display=tcd?'':'none';
 $('tl').style.display=o.label!=null?'':'none';
 if(o.label!=null){$('tli').value=o.label;$('tlc').innerHTML='';['Every day','Sunday – Thursday','Friday & Saturday','Monday – Friday','Saturday & Sunday'].forEach(function(c){var b=document.createElement('button');b.className='btn';b.textContent=c;b.onclick=function(){$('tli').value=c};$('tlc').appendChild(b)})}
 $('tq').innerHTML='';(o.quick||[]).forEach(function(q){var b=document.createElement('button');b.className='btn';b.textContent=q;b.onclick=function(){$('tm').classList.remove('on');tqc(q)};$('tq').appendChild(b)});
 $('tm').classList.add('on');
}
$('tx').onclick=function(){$('tm').classList.remove('on')};
$('tsv').onclick=function(){$('tm').classList.remove('on');tcb($('ts').value,$('te').value,$('tli').value.trim())};
$('td').onclick=function(){$('tm').classList.remove('on');tcd&&tcd()};
function opsModal(i){var o=i==null?{days:'',open:'9:00 AM',close:'2:00 AM'}:D.ops[i];
 timeModal(i==null?'Add operational hours':'Edit operational hours',o.open,o.close,{label:o.days,
  onSave:function(a,b,l){if(!l)return;var n={days:l,open:a,close:b};if(i==null)D.ops.push(n);else D.ops[i]=n;chg()},
  onDel:i==null?null:function(){D.ops.splice(i,1);chg()}})}
function staffModal(s){var team=s.team;modal('Edit staff',s.name,D.teams,function(v){if(v.trim()){s.name=v.trim();s.team=team;chg()}},function(){D.staff=D.staff.filter(function(x){return x!==s});chg()},function(c){team=c},s.team)}
$('app').onclick=function(e){
 if(!mgr)return;var t=e.target,W=D.weeks[key()];
 if(t.dataset.add){var a=W[t.dataset.add]||(W[t.dataset.add]=[]);a.push(['OFF','OFF','OFF','OFF','OFF','OFF','OFF']);chg();return}
 var c=t.closest('[data-d]');
 if(c){var s=D.staff.filter(function(x){return x.id===c.dataset.s})[0],l=+c.dataset.l,d=+c.dataset.d,arr=W[s.id];
  var m=/^(.+) - (.+)$/.exec(arr[l][d]);
  timeModal(s.name+' · '+DAYS[d],m?m[1]:'9:00 AM',m?m[2]:'5:00 PM',{quick:['OFF','TBA'],onQuick:function(q){arr[l][d]=q;if(l>0&&arr.length>1&&arr[l].every(function(x){return x==='OFF'}))arr.splice(l,1);chg()},onSave:function(a,b){arr[l][d]=a+' - '+b;chg()}});return}
 var n=t.closest('[data-s]');if(n&&n.className==='name'){staffModal(D.staff.filter(function(x){return x.id===n.dataset.s})[0]);return}
 if(t.dataset.act==='note'){modal('Add note','',null,function(v){if(v.trim()){D.notes.push(v.trim());chg()}});return}
 if(t.dataset.act==='ops'){opsModal(null);return}
 var o=t.closest('[data-o]');if(o){opsModal(+o.dataset.o);return}
 var li=t.closest('[data-n]');if(li){var i=+li.dataset.n;modal('Edit note',D.notes[i],null,function(v){if(v.trim())D.notes[i]=v.trim();chg()},function(){D.notes.splice(i,1);chg()})}
};
$('aStaff').onclick=function(){var team=D.teams[0];modal('Add staff','',D.teams,function(v){if(v.trim()){D.staff.push({id:'s'+Date.now(),team:team,name:v.trim()});chg()}},null,function(c){team=c},team)};
$('cWeek').onclick=function(){var ks=Object.keys(D.weeks).sort(),p=ks.filter(function(k){return k<key()}).pop()||ks.pop();
 D.weeks[key()]=p?JSON.parse(JSON.stringify(D.weeks[p])):{};chg()};
$('bWeek').onclick=function(){D.weeks[key()]={};D.staff.forEach(function(s){D.weeks[key()][s.id]=[['OFF','OFF','OFF','OFF','OFF','OFF','OFF']]});chg()};
$('prev').onclick=function(){ws.setDate(ws.getDate()-7);render()};
$('next').onclick=function(){ws.setDate(ws.getDate()+7);render()};
$('today').onclick=function(){ws=mon(new Date());render()};
$('mgr').onclick=function(){mgr=!mgr;render()};
var GK='bw-gh',G={};try{G=JSON.parse(localStorage.getItem(GK))||{}}catch(e){}
var PK='bw-payroll',P={rates:{},sales:{},target:30,ot:false};
try{P=Object.assign(P,JSON.parse(localStorage.getItem(PK))||{})}catch(e){}
function psave(){try{localStorage.setItem(PK,JSON.stringify(P))}catch(e){}}
function payRender(){
 var el=$('pay');el.style.display=mgr?'':'none';if(!mgr)return;
 var W=D.weeks[key()];
 if(!W){el.innerHTML='<h3>Payroll</h3><div class="empty">No schedule for this week</div>';return}
 var rows='',th=0,tc=0;
 D.staff.forEach(function(s){
  var h=(W[s.id]||[]).reduce(function(a,l){return a+l.reduce(function(b,v){return b+hrs(v)},0)},0),r=+P.rates[s.id]||0,
  c=r*(P.ot?Math.min(h,44)+1.5*Math.max(h-44,0):h);th+=h;tc+=c;
  rows+='<tr><td class="pn">'+esc(s.name)+'</td><td>'+r1(h)+'</td><td><input type="number" min="0" step="0.01" data-r="'+s.id+'" value="'+(P.rates[s.id]||'')+'" placeholder="0.00"></td><td>$'+c.toFixed(2)+'</td></tr>'});
 var sales=+P.sales[key()]||0,pct=sales>0?tc/sales*100:null,tg=+P.target||0;
 el.innerHTML='<h3>Payroll % calculator</h3><div class="pb"><div class="pf"><div><label>Sales previous week ($)</label><input type="number" min="0" step="0.01" data-sales="1" value="'+(sales||'')+'" placeholder="0.00"></div><div><label>Target payroll %</label><input type="number" min="0" step="0.1" data-target="1" value="'+(tg||'')+'" placeholder="30"></div><label style="display:flex;gap:6px;align-items:center;margin:0;letter-spacing:.04em;text-transform:none;font-size:14px;color:#111"><input type="checkbox" data-ot="1"'+(P.ot?' checked':'')+'> Overtime over 44 h/week at 1.5×</label></div>'+
 '<div class="scroll"><table><tr><th>Name</th><th>Hours</th><th>Rate ($/hr)</th><th>Cost</th></tr>'+rows+'<tr class="total"><td>TOTAL</td><td>'+r1(th)+'</td><td></td><td>$'+tc.toFixed(2)+'</td></tr></table></div>'+
 '<div class="big"><span>Payroll cost <b>$'+tc.toFixed(2)+'</b></span><span>Payroll % of previous week\'s sales <b>'+(pct==null?'—':pct.toFixed(1)+'%')+'</b></span>'+(pct!=null&&tg?'<span>'+(pct>tg?'Over target by '+(pct-tg).toFixed(1)+' pts':'Within target ('+(tg-pct).toFixed(1)+' pts under)')+'</span>':'')+'</div>'+
 '<div class="hint" style="text-align:left">Rates, sales and target are saved on this device only and are never published to GitHub.</div></div>';
}
$('pay').onchange=function(e){var d=e.target.dataset;
 if(d.r)P.rates[d.r]=parseFloat(e.target.value)||0;
 else if(d.sales)P.sales[key()]=parseFloat(e.target.value)||0;
 else if(d.target)P.target=parseFloat(e.target.value)||0;
 else if(d.ot)P.ot=e.target.checked;else return;
 psave();payRender()};
function mig(){D.ops=D.ops.map(function(o){return typeof o==='string'?{days:o,open:'9:00 AM',close:'2:00 AM'}:o})}
function pretty(){return JSON.stringify(D,null,1)}
function dl(blob,name){var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove()}
$('dj').onclick=function(){dl(new Blob([pretty()],{type:'application/json'}),'schedule.json')};
$('gs').onclick=function(){$('gr').value=G.repo||'';$('gb').value=G.branch||'main';$('gt').value=G.token||'';$('gm').classList.add('on')};
$('gx').onclick=function(){$('gm').classList.remove('on')};
$('gsv').onclick=function(){G={repo:$('gr').value.trim(),branch:$('gb').value.trim()||'main',token:$('gt').value.trim()};try{localStorage.setItem(GK,JSON.stringify(G))}catch(e){}$('gm').classList.remove('on')};
$('pub').onclick=async function(){
 if(!G.repo||!G.token){$('st').textContent='Add your GitHub details first';$('gs').click();return}
 $('st').textContent='Publishing…';
 var u='https://api.github.com/repos/'+G.repo+'/contents/schedule.json',H={Authorization:'Bearer '+G.token,Accept:'application/vnd.github+json'};
 try{
  var sha,r=await fetch(u+'?ref='+encodeURIComponent(G.branch),{headers:H});
  if(r.ok)sha=(await r.json()).sha;else if(r.status!==404)throw new Error(r.status===401?'bad token':r.status===403?'token lacks access':'repo not found');
  var body={message:'Update schedule',branch:G.branch,content:btoa(unescape(encodeURIComponent(pretty())))};if(sha)body.sha=sha;
  r=await fetch(u,{method:'PUT',headers:H,body:JSON.stringify(body)});
  if(!r.ok)throw new Error('GitHub said '+r.status);
  dirty=false;$('st').textContent='Published ✓ — live on the site in about a minute';
 }catch(e){$('st').textContent='Could not publish: '+e.message}
};
$('mgr').onclick=function(){mgr=!mgr;render()};
window.onbeforeunload=function(){return dirty?'Unpublished changes':undefined};
$('shot').onclick=async function(){
 var b=$('shot');b.textContent='Saving…';
 try{
  var c=await html2canvas($('cap'),{scale:2,backgroundColor:'#f6f2e9',windowWidth:1180,onclone:function(d){
   d.querySelector('.wrap').style.cssText='max-width:none;padding:0;margin:0';d.getElementById('cap').style.width='1180px';
   [].forEach.call(d.querySelectorAll('.scroll'),function(x){x.style.overflow='visible'});
   [].forEach.call(d.querySelectorAll('.nav,.mbar'),function(x){x.style.display='none'});
   [].forEach.call(d.querySelectorAll('.ln'),function(x){x.remove()})}});
  var blob=await new Promise(function(r){c.toBlob(r,'image/png')}),name='biryaniwalla-schedule-'+key()+'.png',f=new File([blob],name,{type:'image/png'});
  if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:'Weekly Staff Schedule'})}catch(e){if(e.name!=='AbortError')dl(blob,name)}}
  else dl(blob,name);
 }catch(e){alert('Could not create the image')}
 b.textContent='Save image'};
mig();render();
fetch('schedule.json?t='+Date.now()).then(function(r){return r.ok?r.json():null}).then(function(j){if(j&&j.staff&&!dirty){D=j;mig();render()}}).catch(function(){});
</script></body></html>
